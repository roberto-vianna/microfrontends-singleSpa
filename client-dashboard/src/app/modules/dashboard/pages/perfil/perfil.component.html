<div class="min-h-scree px-4 pb-6">
    <div class="mb-6">
        <h1 class="text-4xl mt-0 font-bold mb-0 text-primary">Perfil do Usuário</h1>
        <p class="text-gray-400 mt-2">Gerencie suas informações pessoais e preferências.</p>
    </div>
    <div class="mb-6 flex-grow h-0.5 bg-gradient-to-r from-transparent via-gray-700 to-transparent">
    </div>

    <div class="rounded-2xl bg-background p-6 ">
        <div class="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-6 ">

            <div class="flex flex-col items-center text-center">
                <div class="relative">
                    <img src="https://thumbs.dreamstime.com/b/s%C3%ADmbolo-de-perfil-masculino-inteligente-retrato-estilo-desenho-animado-m%C3%ADnimo-166146967.jpg"
                        alt="User Avatar" class="size-36 rounded-full" />
                    <button class="absolute bottom-0 right-0 bg-yellow-500 text-black p-1 rounded-full">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-6 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                        </svg>
                    </button>
                </div>

                <div class="text-center mt-4">
                    <p class="text-2xl font-bold my-0 truncate max-w-[200px]">
                        {{ user.fullName }}
                    </p>
                </div>
                <div class="my-1 text-sm font-bold text-primary">
                    CLIENTE VIP
                </div>

                <span
                    class="border border-solid border-primary shadow-sm shadow-yellow-500/50 bg-transparent text-white text-xs font-bold px-2 py-1 rounded-full flex">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="size-4 mr-1 text-green-600">
                        <path fill-rule="evenodd"
                            d="M8.603 3.799A4.49 4.49 0 0 1 12 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 0 1 3.498 1.307 4.491 4.491 0 0 1 1.307 3.497A4.49 4.49 0 0 1 21.75 12a4.49 4.49 0 0 1-1.549 3.397 4.491 4.491 0 0 1-1.307 3.497 4.491 4.491 0 0 1-3.497 1.307A4.49 4.49 0 0 1 12 21.75a4.49 4.49 0 0 1-3.397-1.549 4.49 4.49 0 0 1-3.498-1.306 4.491 4.491 0 0 1-1.307-3.498A4.49 4.49 0 0 1 2.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 0 1 1.307-3.497 4.49 4.49 0 0 1 3.497-1.307Zm7.007 6.387a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                            clip-rule="evenodd" />
                    </svg>
                    VERIFICADO
                </span>
            </div>
            <div class="space-y-6">
                <form (submit)="updateProfile()">
                    <div>
                        <h2 class="text-lg font-semibold mb-2 flex items-center gap-4 mt-0">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                class="size-6 text-primary">
                                <path fill-rule="evenodd"
                                    d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                                    clip-rule="evenodd" />
                            </svg>
                            Informações Pessoais
                        </h2>
                        <div class="flex items-center">
                            <div class="flex-grow h-0.5 bg-gradient-to-r from-transparent via-gray-700 to-transparent">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
                            <div>
                                <label class="block text-xs text-white pb-2">Nome Completo</label>
                                <input type="text" [(ngModel)]="user.fullName" name="fullName"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-color_text focus:ring-1 focus:ring-primary focus:outline-none" />
                            </div>
                            <div>
                                <label class="block text-xs text-white pb-2">Telefone</label>
                                <input type="tel" [(ngModel)]="user.telefone" name="telefone"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-color_text focus:ring-1 focus:ring-primary focus:outline-none" />
                            </div>
                            <div>
                                <label class="block text-xs text-white pb-2">Endereço de E-mail</label>
                                <input type="email" [(ngModel)]="user.email" name="email"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-color_text focus:ring-1 focus:ring-primary focus:outline-none" />
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold mb-2 mt-8 flex items-center gap-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                class="size-6 text-primary">
                                <path fill-rule="evenodd"
                                    d="M12.516 2.17a.75.75 0 0 0-1.032 0 11.209 11.209 0 0 1-7.877 3.08.75.75 0 0 0-.722.515A12.74 12.74 0 0 0 2.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 0 0 .374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.39-.223-2.73-.635-3.985a.75.75 0 0 0-.722-.516l-.143.001c-2.996 0-5.717-1.17-7.734-3.08Zm3.094 8.016a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                                    clip-rule="evenodd" />
                            </svg>
                            Segurança
                        </h2>
                        <div class="flex items-center">
                            <div class="flex-grow h-0.5 bg-gradient-to-r from-transparent via-gray-700 to-transparent">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 mb-6">
                            <div class="col-span-1">
                                <label class="block text-xs text-white pb-2">Senha Atual</label>
                                <input type="password" [(ngModel)]="user.password" name="password"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-gray-300 focus:ring-1 focus:ring-primary focus:outline-none"
                                    placeholder="••••••••" readonly />
                            </div>
                            <div>
                                <label class="block text-xs text-white pb-2">Nova Senha</label>
                                <input type="password" [(ngModel)]="newPassword" name="newPassword"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-gray-300 focus:ring-1 focus:ring-primary focus:outline-none"
                                    placeholder="••••••••" />
                            </div>
                            <div>
                                <label class="block text-xs text-white pb-2">Confirmar Nova Senha</label>
                                <input type="password" [(ngModel)]="confirmNewPassword" name="confirmNewPassword"
                                    class="w-full box-border px-2 py-2 rounded-lg bg-zinc-800 text-gray-300 focus:ring-1 focus:ring-primary focus:outline-none"
                                    placeholder="••••••••" />
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-4 mt-2">
                        <button type="button" (click)="resetForm()"
                            class=" py-2 px-4 bg-transparent border border-solid border-color_text text-color_text font-bold rounded-md transition-colors duration-300 hover:bg-zinc-800">
                            Cancelar
                        </button>
                        <button type="submit"
                            class="py-2 px-4 rounded-lg bg-yellow-500 text-black font-bold hover:bg-yellow-600 flex items-center justify-center">
                            Salvar alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center text-gray-500 text-xs my-6 ">
        © 2026 AgendBarber System. Todos os direitos reservados.
    </footer>
</div>
